name: Test and deploy

on:
  push:

jobs:
  use-resusable:
    uses: mungeh/github-actions-training/.github/workflows/reusable.yml@main
    with:
      node-version: "20"

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: use-resusable
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: ./dist
          retention-days: 7
