name: Test and deploy

on:
  push:

jobs:
  use-reusble:
    uses: mungeh/github-actions-training/.github/workflows/reusble.yml@main
    with:
      NODE_VERSION: '20'

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: use-reusble
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: ./dist
          retention-days: 7
      - name: deploying to staging
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: "deploying to staging"

      - name: failure alert
        if: failure()
        run: echo "build faild"
